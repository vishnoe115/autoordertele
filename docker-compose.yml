services:
  autoordertele:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: autoordertele
    restart: unless-stopped
    init: true

    env_file:
      - config.env

    # Bind only to localhost. Put Nginx/Caddy/Cloudflare Tunnel in front
    # for public HTTPS webhook access.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    environment:
      HOST: "0.0.0.0"
      PORT: "8080"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
