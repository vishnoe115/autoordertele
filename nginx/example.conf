server {
 listen 443 ssl http2;
 server_name bot.example.com;
 location /webhook/klikqris { proxy_pass http://127.0.0.1:8080/webhook/klikqris; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
 location /health { proxy_pass http://127.0.0.1:8080/health; proxy_set_header Host $host; }
}
